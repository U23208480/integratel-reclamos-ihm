# Ejecuta el sistema completo (Flask + MySQL) con:  docker compose up --build
# Luego abre http://localhost:5000  (cuenta demo: DNI 71234567, clave Demo1234)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: RootIntegratel2026!
      MYSQL_DATABASE: integratel_reclamos
      MYSQL_USER: integratel_app
      MYSQL_PASSWORD: IntegratelReclamos2026!
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootIntegratel2026!"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - dbdata:/var/lib/mysql
  web:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_USER: integratel_app
      MYSQL_PASSWORD: IntegratelReclamos2026!
      MYSQL_DB: integratel_reclamos
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
