<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña | Sistema de Gestión de Reclamos — Integratel Perú</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B2545%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%2300B4D8%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22900%22>I</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body{background:linear-gradient(170deg,#0D2B50 0%,#103562 55%,#123C6C 100%);min-height:100vh;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
  .login-card{
    width:100%;max-width:960px;background:var(--surface);border-radius:26px;overflow:hidden;
    display:grid;grid-template-columns:1fr 1fr;box-shadow:0 40px 90px rgba(0,0,0,.35);position:relative;z-index:2;
  }
  .login-side{background:linear-gradient(160deg,var(--navy),var(--steel) 80%);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;}
  .login-form-side{padding:48px 44px;}
  .pass-wrap{position:relative;}
  .pass-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);display:flex;}
  .alert-box{
    display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);
    padding:12px 14px;border-radius:12px;font-size:calc(13px * var(--fs,1));font-weight:600;margin-bottom:18px;display:none;
  }
  .alert-box.show{display:flex;}
  @media (max-width:820px){.login-card{grid-template-columns:1fr;}.login-side{display:none;}}
</style>
</head>
<body>

<div class="login-wrap">
  <a href="../index.html" class="auth-logo"><span class="brand-mark">IT</span><span>Integratel</span></a>
  <div class="hero-blob" style="width:460px;height:460px;background:radial-gradient(circle,#0093B0,transparent 70%);top:-160px;right:-100px;"></div>
  <div class="hero-blob" style="width:340px;height:340px;background:radial-gradient(circle,#134074,transparent 70%);bottom:-140px;left:-80px;"></div>

  <div class="login-card" id="contenido" role="main" tabindex="-1" style="max-width:480px;grid-template-columns:1fr;">
    <div class="login-form-side" style="text-align:center;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--cyan-light);color:var(--cyan-text);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 style="font-size:calc(22px * var(--fs,1));color:var(--ink);">Recuperar contraseña</h1>
      <p style="color:var(--muted);font-size:calc(14px * var(--fs,1));margin:8px 0 22px;">Escribe tu correo o N° de contrato/DNI. Te enviaremos instrucciones para restablecerla.</p>

      <div class="alert-box" id="alert-box" role="alert">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span id="alert-text"></span>
      </div>

      <form id="rec-form" novalidate style="text-align:left;">
        <div class="field">
          <label for="f-ident">Correo o N° de contrato/DNI <span class="req">*</span></label>
          <input class="input" id="f-ident" autocomplete="username" type="text" placeholder="correo@ejemplo.com o 71234567" required>
          <span class="field-error">Ingresa tu correo o N° de contrato/DNI.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Enviar instrucciones</button>
      </form>

      <div id="rec-ok" role="status" aria-live="polite" style="display:none;background:var(--cyan-light);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:calc(13px * var(--fs,1));color:var(--ink);text-align:left;"></div>

      <p style="margin-top:22px;">
        <a href="index.html" style="color:var(--muted);font-size:calc(13px * var(--fs,1));font-weight:600;">&larr; Volver al inicio de sesión</a>
      </p>
    </div>
  </div>
</div>

<script src="../assets/js/reclamos.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/estados.js"></script>
<script src="../assets/js/a11y.js"></script>
<script>
  const form = document.getElementById('rec-form');
  const btn = form.querySelector('button[type="submit"]');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('alert-box');
    const ok = document.getElementById('rec-ok');
    box.classList.remove('show'); ok.style.display = 'none';
    const ident = document.getElementById('f-ident');
    if (!Estados.validar(form, [{
      id: 'f-ident', etiqueta: 'Correo o N° de contrato',
      test: (v) => !!v,
      mensaje: 'Escribe tu correo o tu N° de contrato / DNI para poder enviarte el enlace.',
    }])) return;
    btn.disabled = true; const prev = btn.textContent; btn.textContent = 'Enviando…';
    const r = await Reclamos.recuperarContrasena(ident.value.trim());
    btn.disabled = false; btn.textContent = prev;
    if (r.ok) {
      ok.textContent = r.mensaje; ok.style.display = 'block';
      if (window.A11Y) A11Y.anunciar(r.mensaje);
    }
    else { document.getElementById('alert-text').textContent = r.error || 'No se pudo procesar la solicitud.'; box.classList.add('show'); }
  });
</script>
</body>
</html>
