<script src="../assets/js/reclamos.js"></script>
<script>if (!Reclamos.requireSession()) { throw new Error('sin sesión'); }</script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/estados.js"></script>
<script src="../assets/js/a11y.js"></script>
<script src="../assets/js/app-shell.js"></script>

<script>
const dni = Reclamos.getSession();
const sim = new URLSearchParams(location.search).get('simular');

const ICN = {
  reclamo: '<path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4M9 11V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v18M9 11h6"/>',
  cuenta: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
  seguridad: '<path d="M12 3 20 6v6.2c0 5-3.6 8.2-8 9.2-4.4-1-8-4.2-8-9.2V6l8-3z"/>',
};

async function cargar() {
  const detener = Estados.cargando('#lista', 3, 'Cargando tus avisos…');
  const r = await Reclamos.getNotificaciones(dni, sim);
  if (detener) detener();

  if (Estados.desdeRespuesta('#lista', r, {
    acciones: [{ texto: 'Reintentar', onClick: cargar },
               { texto: 'Ir a mis reclamos', href: 'mis-reclamos.html' }],
  })) return;

  const n = r.notificaciones || [];
  document.getElementById('notif-sub').textContent =
    n.length ? (n.length + (n.length === 1 ? ' aviso' : ' avisos')) : 'Sin avisos por ahora';

  if (!n.length) {
    // Estado 3 del catálogo: vacío por historial
    Estados.pintar('#lista', 'vacio-historial', {
      acciones: [
        { texto: 'Registrar un reclamo', href: 'nuevo-reclamo.html' },
        { texto: 'Elegir cómo quiero que me avisen', href: 'perfil.html' },
      ],
    });
    return;
  }

  document.getElementById('lista').innerHTML = n.map(x => `
    <div class="claim-row" style="cursor:${x.reclamoId ? 'pointer' : 'default'};grid-template-columns:44px 1fr auto;"
         ${x.reclamoId ? 'onclick="location.href=\'detalle.html?id=' + encodeURIComponent(x.reclamoId) + '\'"' : ''}>
      <span class="kpi-icon" style="background:var(--cyan-light);color:var(--cyan-text);width:40px;height:40px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICN[x.tipo] || ICN.cuenta}</svg>
      </span>
      <div>
        <div class="claim-title">${x.titulo}${x.leida ? '' : ' <span class="badge badge-proceso" style="margin-left:6px;">Nuevo</span>'}</div>
        <div class="claim-meta">${x.detalle || ''}</div>
      </div>
      <div class="claim-date">${Reclamos.fechaHora(x.createdAt)}</div>
    </div>`).join('');
}

document.getElementById('btn-leidas').addEventListener('click', async () => {
  await Reclamos.marcarNotificacionesLeidas(dni);
  showToast('Listo', 'Marcamos todos los avisos como leídos.');
  cargar();
});
let silenciado = false;
document.getElementById('btn-silenciar').addEventListener('click', async () => {
  silenciado = !silenciado;
  const r = await Reclamos.silenciarAvisos(dni, silenciado);
  if (r.ok) {
    document.getElementById('btn-silenciar').textContent = silenciado ? 'Reactivar avisos' : 'Silenciar avisos';
    showToast(silenciado ? 'Avisos silenciados' : 'Avisos reactivados',
      silenciado ? 'Dejas de recibirlos, pero conservas tus reclamos.' : 'Volverás a recibir los avisos.');
  }
});
cargar();
</script>
