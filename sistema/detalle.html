<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del Reclamo | Integratel Perú</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B2545%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%2300B4D8%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22900%22>I</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">IT</span>
      <div><b style="display:block;font-size:calc(14px * var(--fs,1));">Integratel</b><span style="font-size:calc(11px * var(--fs,1));color:#9FBED3;">Reclamos</span></div>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      <a href="nuevo-reclamo.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 5v14M5 12h14"/></svg>Nuevo reclamo</a>
      <a href="mis-reclamos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4M9 11V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v18M9 11h6m0 0h4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-4"/></svg>Mis reclamos</a>
      <a href="seguimiento.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Seguimiento</a>
      <a href="notificaciones.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M6 16.4v-5a6 6 0 0 1 12 0v5l2 3H4z"/><path d="M10 19.4a2 2 0 0 0 4 0"/></svg>Notificaciones</a>
      <a href="accesibilidad.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="4.5" r="2.1"/><path d="M4.8 8.8 12 10.4l7.2-1.6M12 10.4v4.2M12 14.6 8.8 21M12 14.6 15.2 21"/></svg>Accesibilidad</a>
      <a href="perfil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>Perfil</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar cian" id="side-avatar">--</div>
        <div><b id="side-nombre">Usuario</b><span id="side-dni">—</span></div>
      </div>
      <button class="btn btn-sm" id="btn-logout" style="width:100%;margin-top:12px;background:rgba(255,255,255,.08);color:#fff;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Salir
      </button>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="btn-sidebar-toggle" class="nav-toggle" aria-label="Abrir el menú" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="17" y2="17"/></svg></button>
        <a href="mis-reclamos.html" aria-label="Volver a mis reclamos" title="Volver a mis reclamos" style="width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.3"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <h1 class="topbar-title">Detalle del reclamo</h1>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="btn-email" class="btn btn-ghost btn-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          Reenviar por correo
        </button>
        <button id="btn-pdf" class="btn btn-navy btn-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Descargar PDF
        </button>
      </div>
    </div>

    <div class="app-content" id="content" role="main" tabindex="-1" style="max-width:920px;">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script src="../assets/js/reclamos.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/estados.js"></script>
<script src="../assets/js/a11y.js"></script>
<script>
  if (!Reclamos.requireSession()) { }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  function statusBadge(estado) {
    const map = { 'Recibido': 'badge-recibido', 'En proceso': 'badge-proceso', 'Atendido': 'badge-atendido', 'Improcedente': 'badge-improcedente' };
    return `<span class="badge ${map[estado] || 'badge-navy'}"><span class="badge-dot"></span>${estado}</span>`;
  }

  function stepClass(estado, target) {
    const order = ['Recibido', 'En proceso', 'Atendido'];
    const cur = order.indexOf(estado), tgt = order.indexOf(target);
    if (tgt < cur) return 'done'; if (tgt === cur) return 'current'; return '';
  }

  function historyIcon(estado) {
    const icons = {
      'Recibido': '<path d="M12 5v14M5 12h14"/>',
      'En proceso': '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
      'Atendido': '<path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/>',
      'Improcedente': '<path d="M18 6 6 18M6 6l12 12"/>',
    };
    return icons[estado] || '';
  }

  function stepperOrBanner(claim) {
    if (claim.estado === 'Improcedente') {
      return `
        <div style="display:flex;gap:14px;align-items:flex-start;background:var(--bad-bg);border:1px solid var(--bad);border-radius:14px;padding:18px;margin:28px 0 6px;">
          <div style="width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--bad);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </div>
          <div>
            <b style="color:var(--bad);font-size:calc(14.5px * var(--fs,1));">Reclamo declarado improcedente</b>
            <p style="color:var(--ink);font-size:calc(13.5px * var(--fs,1));margin-top:4px;">El área responsable evaluó el caso y determinó que no corresponde continuar con el proceso. Revisa el historial para conocer el detalle.</p>
          </div>
        </div>`;
    }
    return `
        <div class="stepper" style="margin:34px 0 10px;" role="group" aria-label="Avance del reclamo: estado actual ${claim.estado}">
          <div class="step ${stepClass(claim.estado, 'Recibido')}">
            <div class="step-line"></div>
            <div class="step-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
            <b>Recibido</b><span>Ticket generado</span>
          </div>
          <div class="step ${stepClass(claim.estado, 'En proceso')}">
            <div class="step-line"></div>
            <div class="step-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>
            <b>En proceso</b><span>Área responsable evaluando</span>
          </div>
          <div class="step ${stepClass(claim.estado, 'Atendido')}">
            <div class="step-line"></div>
            <div class="step-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg></div>
            <b>Atendido</b><span>Reclamo resuelto</span>
          </div>
        </div>`;
  }

  const ACTION_LABELS = {
    'En proceso': 'Marcar en proceso',
    'Atendido': 'Marcar atendido',
    'Improcedente': 'Marcar improcedente',
  };
  const ACTION_CLASSES = {
    'En proceso': 'btn-navy',
    'Atendido': 'btn-primary',
    'Improcedente': 'btn-danger',
  };

  const simular = new URLSearchParams(location.search).get('simular');

  async function render() {
    const content = document.getElementById('content');

    // Estado 4 · carga
    const detener = Estados.cargando(content, 3, 'Cargando el reclamo ' + (id || '') + '…');
    const r = await Reclamos.getClaimSimulado(id, simular);
    if (detener) detener();

    // Estados 5, 6, 8 y 9 · según lo que responda el servidor
    if (Estados.desdeRespuesta(content, r, {
      acciones: [
        { texto: 'Reintentar', onClick: render },
        { texto: 'Volver a mis reclamos', href: 'mis-reclamos.html' },
      ],
    })) return;

    const claim = r.reclamo;
    if (!claim) {
      // Estado 8 · contenido no disponible
      Estados.pintar(content, 'no_encontrado', {
        detalle: id ? ('Código consultado: ' + id) : 'No llegó ningún código en la dirección.',
        acciones: [
          { texto: 'Volver a mis reclamos', href: 'mis-reclamos.html' },
          { texto: 'Consultar por código', href: 'seguimiento.html' },
        ],
      });
      return;
    }

    const terminal = claim.estado === 'Atendido' || claim.estado === 'Improcedente';
    const actionsHtml = terminal ? '' : `
      <div class="panel" style="background:var(--cyan-light);border:none;box-shadow:none;">
        <p style="font-size:calc(12.5px * var(--fs,1));color:var(--cyan-text);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">Panel de actualización (demo / área responsable)</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${['En proceso', 'Atendido', 'Improcedente'].filter(e => e !== claim.estado).map(e => `
            <button class="btn btn-sm ${ACTION_CLASSES[e]}" data-set-estado="${e}">${ACTION_LABELS[e]}</button>
          `).join('')}
        </div>
      </div>`;

    content.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div>
            <span class="claim-id" style="font-size:calc(15px * var(--fs,1));">${claim.id}</span>
            <h2 style="margin-top:10px;">${claim.tipo}</h2>
            <p>Registrado el ${Reclamos.fechaHora(claim.createdAt)}</p>
          </div>
          ${statusBadge(claim.estado)}
        </div>
        ${stepperOrBanner(claim)}
      </div>

      ${actionsHtml}

      <div class="panel">
        <h2 style="font-size:calc(16px * var(--fs,1));color:var(--ink);margin-bottom:16px;">Descripción</h2>
        <p style="color:var(--ink);font-size:calc(14.5px * var(--fs,1));line-height:1.6;">${claim.descripcion}</p>
        ${claim.archivos && claim.archivos.length ? `
          <div style="margin-top:16px;">${claim.archivos.map(f => `<span class="file-chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>${f}</span>`).join('')}</div>
        ` : ''}
        <div class="divider"></div>
        <div class="grid cols-2" style="gap:16px;">
          <div><span style="font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:700;text-transform:uppercase;">Solicitante</span><p style="color:var(--ink);font-weight:700;margin-top:4px;">${claim.nombre}</p></div>
          <div><span style="font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:700;text-transform:uppercase;">DNI / Contrato</span><p style="color:var(--ink);font-weight:700;margin-top:4px;">${claim.dni}</p></div>
          <div><span style="font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:700;text-transform:uppercase;">Canal de respuesta</span><p style="color:var(--ink);font-weight:700;margin-top:4px;">${claim.canal}</p></div>
          <div><span style="font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:700;text-transform:uppercase;">${claim.canal === 'Teléfono / SMS' ? 'Teléfono de contacto' : 'Correo de contacto'}</span><p style="color:var(--ink);font-weight:700;margin-top:4px;">${claim.canal === 'Teléfono / SMS' ? (claim.telefono || '—') : (claim.correo || '—')}</p></div>
        </div>
      </div>

      <div class="panel">
        <h2 style="font-size:calc(16px * var(--fs,1));color:var(--ink);margin-bottom:18px;">Historial de actualizaciones</h2>
        <div style="display:flex;flex-direction:column;gap:0;">
          ${claim.historial.slice().reverse().map((h, i, arr) => `
            <div style="display:flex;gap:16px;">
              <div style="display:flex;flex-direction:column;align-items:center;">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--cyan-light);color:var(--cyan-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${historyIcon(h.estado)}</svg>
                </div>
                ${i < arr.length - 1 ? '<div style="width:2px;flex:1;background:var(--line);margin:4px 0;"></div>' : ''}
              </div>
              <div style="padding-bottom:26px;">
                <b style="color:var(--ink);font-size:calc(14px * var(--fs,1));">${h.estado}</b>
                <p style="color:var(--muted);font-size:calc(12.5px * var(--fs,1));margin:2px 0 6px;">${Reclamos.fechaHora(h.fecha)}</p>
                <p style="color:var(--ink);font-size:calc(13.5px * var(--fs,1));">${h.nota}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('content').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-set-estado]');
    if (!btn) return;
    const nuevoEstado = btn.getAttribute('data-set-estado');
    if (nuevoEstado === 'Atendido' || nuevoEstado === 'Improcedente') {
      const txt = nuevoEstado === 'Improcedente'
        ? 'Vas a declarar este reclamo improcedente. Es un estado final: el solicitante recibirá un aviso y el caso se cierra. ¿Confirmas?'
        : 'Vas a cerrar este reclamo como atendido. Es un estado final. ¿Confirmas?';
      if (!confirm(txt)) return;
    }
    document.querySelectorAll('[data-set-estado]').forEach(b => b.disabled = true);
    const result = await Reclamos.cambiarEstado(id, nuevoEstado);
    if (result.ok) {
      showToast('Estado actualizado', `El reclamo ahora está "${result.reclamo.estado}".`);
      if (window.A11Y) A11Y.anunciar('Estado actualizado: el reclamo ahora está ' + result.reclamo.estado + '.');
      render();
    } else {
      showToast('No se pudo actualizar', result.error || 'Ocurrió un error.');
      document.querySelectorAll('[data-set-estado]').forEach(b => b.disabled = false);
    }
  });

  document.getElementById('btn-pdf').addEventListener('click', () => Reclamos.descargarPdf(id));

  document.getElementById('btn-email').addEventListener('click', async () => {
    const btn = document.getElementById('btn-email');
    btn.disabled = true;
    const originalLabel = btn.innerHTML;
    btn.textContent = 'Enviando…';
    const result = await Reclamos.reenviarCorreo(id);
    btn.disabled = false;
    btn.innerHTML = originalLabel;
    if (result.ok && result.correo && result.correo.enviado) {
      if (result.correo.simulado) {
        showToast('Envío simulado', `Sin SMTP configurado: se guardó como si se hubiera enviado a ${result.correo.destinatario}.`);
      } else {
        showToast('Correo enviado', `Se envió el PDF a ${result.correo.destinatario}.`);
      }
    } else {
      showToast('No se pudo enviar', (result.correo && result.correo.error) || result.error || 'Ocurrió un error.');
    }
  });

  render();
</script>
<script src="../assets/js/app-shell.js"></script>
</body>
</html>
